name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web dependencies
        run: |
          cd web-ui
          pnpm install

      - name: Cache debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: chuimou-debug-keystore-v1

      - name: Generate debug keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=ChuiMou,OU=ChuiMou,O=ChuiMou,L=ChuiMou,ST=ChuiMou,C=CN"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chuimou-debug
          path: app/build/outputs/apk/debug/*.apk
